# Self-hosting with Docker: the app plus its own Postgres.
#   cp .env.example .env   # set POSTGRES_PASSWORD, the Neon Auth pair, ALLOWED_EMAILS
#   docker compose up -d --build
# The app applies pending migrations on every start, then listens on port 3000.
# DATABASE_URL / DIRECT_URL from .env are overridden here: under compose the app
# always talks to the db service below, never to the database a local .env names.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: bas_de_laine
      POSTGRES_DB: bas_de_laine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bas_de_laine -d bas_de_laine"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bas_de_laine:${POSTGRES_PASSWORD}@db:5432/bas_de_laine
      DIRECT_URL: postgresql://bas_de_laine:${POSTGRES_PASSWORD}@db:5432/bas_de_laine
    ports:
      - "3000:3000"

volumes:
  db-data:
